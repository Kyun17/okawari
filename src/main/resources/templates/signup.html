<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" th:href="@{/images/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <title>おかわり - 회원가입</title>
</head>
<body>

<!-- 1. 헤더 -->
<div class="header-footer-container auth-header">
    <header class="header-footer-content">
        <!-- 로고 클릭 시 메인 페이지로 이동 -->
        <a th:href="@{/}" class="logo">
            <span class="logo-yummy">🍽 ️モヒョン</span><br>
            <span class="logo-log">おかわり</span>
        </a>
    </header>
</div>

<!-- 2. 메인 컨텐츠 (회원가입 폼) -->
<main class="signup-container">

    <div class="signup-form">
        <div class="form-title-wrapper">
            <!-- 뒤로가기 버튼 -->
            <a href="javascript:history.back()" class="back-btn">⬅</a>
            <h2 class="form-title">회원가입</h2>
        </div>

        <!--
          - th:object="${signupRequest}" : 컨트롤러에서 받은 빈 DTO와 폼을 연결
        -->
        <form th:action="@{/signup}" method="post" th:object="${signupRequest}">

            <!-- (신규) 회원가입 실패 시 에러 메시지 표시 -->
            <div th:if="${error}" class="error-message" th:text="${error}">
                (에러 메시지가 여기에 표시됩니다)
            </div>

            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email" id="email" th:field="*{email}" placeholder="email@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" required>
            </div>

            <div class="form-group">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" required>
            </div>

            <div class="form-group">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" th:field="*{nickname}" required>
            </div>

            <button type="submit" class="submit-btn">회원가입 완료</button>
        </form>

    </div>
</main>
</main>
<!-- 3. 푸터 -->
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
