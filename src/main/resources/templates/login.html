<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" th:href="@{/images/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <title>おかわり - 로그인</title>
</head>
<body>

<!-- 1. 헤더 -->
<div class="header-footer-container auth-header">
    <header class="header-footer-content">
        <!-- 로고 클릭 시 메인 페이지로 이동 -->
        <a th:href="@{/}" class="logo">
            <span class="logo-yummy">🍽 ️モヒョン</span><br>
            <span class="logo-log">おかわり</span>
        </a>
    </header>
</div>

<!-- 2. 메인 컨텐츠 (로그인 폼) -->
<main class="login-container">

    <div class="login-form">
        <h2 class="form-title">로그인</h2>

        <!--
          - 폼 제출 시 POST /login 경로로 요청합니다.
        -->
        <form th:action="@{/login}" method="post">

            <!--
              - 컨트롤러에서 "loginError" 모델 속성이 넘어오면 이 div를 표시합니다.
              - th:text는 내부 텍스트를 모델의 값으로 대체합니다.
            -->
            <div th:if="${loginError}" class="error-message" th:text="${loginError}">
                <!-- (th:text에 의해 이 내용은 대체됩니다) -->
                이메일 또는 비밀번호가 올바르지 않습니다.
            </div>

            <div class="form-group">
                <label for="email">이메일</label>
                <!--
                  - name="email" : UserDTO.LoginRequest의 email 필드와 매핑됩니다.
                -->
                <input type="email" id="email" name="email" placeholder="email@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <!--
                  - name="password" : UserDTO.LoginRequest의 password 필드와 매핑됩니다.
                -->
                <input type="password" id="password" name="password" placeholder="••••••" required>
            </div>

            <button type="submit" class="submit-btn">로그인</button>
        </form>

        <div class="link-group">
            아직 회원이 아니신가요? <a th:href="@{/signup}">회원가입</a>
        </div>
    </div>

</main>
<!-- 3. 푸터 -->
<div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
