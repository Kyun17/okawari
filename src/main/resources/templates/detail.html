<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" th:href="@{/images/favicon.ico}" type="image/x-icon">
    <link rel="stylesheet" th:href="@{/css/common.css}">
    <link rel="stylesheet" th:href="@{/css/detail.css}">
    <title th:text="|おかわり - ${restaurant.name}|">おかわり - 상세</title>
</head>
<body>

<div class="header-footer-container">
    <header class="header-footer-content main-header">
        <a th:href="@{/}" class="logo">
            <span class="logo-yummy">🍽 ️モヒョン</span><br>
            <span class="logo-log">おかわり</span>
        </a>

        <div th:replace="~{main :: auth-buttons-fragment}">
            <div class="auth-buttons">
                <button type="button">로그인</button>
                <button type="button">회원가입</button>
            </div>
        </div>
    </header>
</div>

<div class="restaurant-image-banner">
    <img th:src="@{${restaurant.imageUrl}}" th:alt="${restaurant.name}"
         onerror="this.onerror=null; this.src='https://placehold.co/1200x350/04448b/c19041?text=Image+Ready';">
</div>

<div class="content-section restaurant-details">
    <div class="content-section-inner">
        <span class="category-tag" th:text="${restaurant.category}">한식</span>
        <h1 th:text="${restaurant.name}">도톰 숯불구이</h1>
        <p><span>📍</span> <span th:text="${restaurant.address}">서울시 강남구 테헤란로 123</span></p>
        <p><span>📞</span> <span th:text="${restaurant.phoneNumber}">02-1111-2222</span></p>

        <div class="rating">
            ⭐ <span th:text="${#numbers.formatDecimal(avgRating, 1, 1)}">0.0</span>
            (리뷰 <span th:text="${reviewCount}">0</span>개)
        </div>

    </div>
</div>

<div class="content-section reviews">
    <div class="content-section-inner">

        <div th:if="${successMessage}" class="alert-message alert-success" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="alert-message alert-error" th:text="${errorMessage}"></div>

        <h2 id="review-list-title">리뷰 (<span th:text="${#lists.size(reviews)}">0</span>)</h2>

        <div th:if="${#lists.isEmpty(reviews)}" class="no-reviews">
            <p>아직 작성된 리뷰가 없습니다.<br>첫 번째 리뷰를 남겨주세요!</p>
        </div>

        <ul class="review-list" th:unless="${#lists.isEmpty(reviews)}">

            <li th:each="review : ${reviews}">
                <div class="review-header">
                    <div>
                        <span class="review-author" th:text="${review.nickname}">김신한</span>
                        <span class="review-date" th:text="${review.createdAtFormatted}">2025.11.07 10:30</span>
                    </div>
                    <div class="review-actions" th:if="${review.isOwner}">

                        <button type="button" class="edit"
                                th:attr="data-review-id=${review.reviewId}, data-rating=${review.rating}, data-content=${review.content}"
                                th:onclick="openEditModal(this)">
                            [수정]
                        </button>
                        <button type="button" class="delete"
                                th:onclick="|openDeleteModal(${review.reviewId})|">
                            [삭제]
                        </button>
                    </div>
                </div>
                <div class="review-rating" th:switch="${review.rating}">
                    <span th:case="1">⭐</span>
                    <span th:case="2">⭐⭐</span>
                    <span th:case="3">⭐⭐⭐</span>
                    <span th:case="4">⭐⭐⭐⭐</span>
                    <span th:case="5">⭐⭐⭐⭐⭐</span>
                </div>
                <div class="review-body">
                    <p class="review-text" th:text="${review.content}">정말 맛있습니다! 분위기도 최고예요.</p>
                </div>
            </li>
        </ul>

        <h2 id="review-form-title">리뷰 작성하기</h2>

        <div th:unless="${loggedInUser}" class="review-login-prompt">
            <p>리뷰를 작성하려면 로그인이 필요합니다.</p>
            <button type="button" th:onclick="|location.href='@{/login}'|">로그인 페이지로 이동</button>
        </div>

        <div th:if="${loggedInUser}" class="review-form">
            <form id="reviewCreateForm"
                  th:action="@{/restaurants/{id}/reviews(id=${restaurant.id})}"
                  th:object="${newReviewRequest}" method="post">

                <div class="form-group">
                    <label for="review-rating-input">별점</label>
                    <select id="review-rating-input" th:field="*{rating}">
                        <option value="5">⭐⭐⭐⭐⭐ (5점)</option>
                        <option value="4">⭐⭐⭐⭐ (4점)</option>
                        <option value="3">⭐⭐⭐ (3점)</option>
                        <option value="2">⭐⭐ (2점)</option>
                        <option value="1">⭐ (1점)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="review-text">리뷰 내용</label>
                    <textarea id="review-text" rows="4" th:field="*{content}"
                              placeholder="방문 후기를 남겨주세요 (필수)" required></textarea>
                </div>
                <button type="submit" class="submit-review-btn">리뷰 등록</button>
            </form>
        </div>

    </div>
</div>
</main>

<!-- 3. 푸터 -->
<div th:replace="~{fragments/footer :: site-footer}"></div>

<div id="editReviewModal" class="modal-overlay">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal('editReviewModal')">&times;</span>
        <h3>리뷰 수정하기</h3>

        <form id="reviewEditForm"
              th:action="@{/reviews/0/edit}"
              th:object="${updateReviewRequest}" method="post">

            <input type="hidden" name="restaurantId" th:value="${restaurant.id}" />

            <div class="form-group">
                <label for="edit-review-rating">별점</label>
                <select id="edit-review-rating" th:field="*{rating}">
                    <option value="5">⭐⭐⭐⭐⭐ (5점)</option>
                    <option value="4">⭐⭐⭐⭐ (4점)</option>
                    <option value="3">⭐⭐⭐ (3점)</option>
                    <option value="2">⭐⭐ (2점)</option>
                    <option value="1">⭐ (1점)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="edit-review-content">리뷰 내용</label>
                <textarea id="edit-review-content" rows="4" th:field="*{content}" required></textarea>
            </div>
            <button type="submit" class="submit-review-btn">리뷰 수정</button>
        </form>
    </div>
</div>

<div id="deleteReviewModal" class="modal-overlay">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal('deleteReviewModal')">&times;</span>
        <h3>리뷰 삭제</h3>
        <p class="delete-confirm-text">
            정말로 이 리뷰를 삭제하시겠습니까?<br>
            삭제된 데이터는 복구할 수 없습니다.
        </p>

        <form id="reviewDeleteForm"
              th:action="@{/reviews/0/delete}"
              th:object="${deleteReviewRequest}" method="post">

            <input type="hidden" name="restaurantId" th:value="${restaurant.id}" />

            <div class="modal-buttons">
                <button type="button" class="btn-cancel" onclick="closeModal('deleteReviewModal')">취소</button>
                <button type="submit" class="btn-delete">삭제</button>
            </div>
        </form>
    </div>
</div>
<script th:src="@{/js/detail.js}"></script>
</body>
</html>
